# ==============================================================================
# Heritage AI Decay Monitoring - Model Configuration
# Primary Source: Senmozhi Project Proposal (Work II, Step 3, 4, 5, 6)
# ==============================================================================

model:
  name: "Single Shot MultiBox Detector (SSD)"
  architecture: "SSD300" # or "SSD512"
  backbone: "mobilenet_v2" # lightweight for real-time edge/drone execution (or vgg16 / resnet50)
  pretrained: true
  num_classes: 4 # Normal, Crack, Moss, Seepage (+ 1 background)
  input_resolution: [300, 300, 3]

# Hyperparameter Optimization (Senmozhi Step 4)
hyperparameter_search:
  methods: ["random_search", "manual_fine_tuning"]
  parameters:
    learning_rate:
      type: "float"
      range: [0.0001, 0.01]
      default: 0.001
    batch_size:
      type: "int"
      options: [4, 8, 16, 32]
      default: 8
    optimizer:
      type: "categorical"
      options: ["SGD_with_momentum", "AdamW"]
      default: "AdamW"
    weight_decay:
      default: 0.0005
    lr_scheduler:
      type: "StepLR"
      step_size: 15
      gamma: 0.1

# Training Configuration (Senmozhi Step 5)
training:
  stratified_sampling: true # Maintain class balance across batches
  epochs: 50
  loss_functions:
    classification: "focal_loss_or_smooth_ce"
    localization: "smooth_l1_loss"

# Post-Processing
post_processing:
  confidence_threshold: 0.40
  nms_iou_threshold: 0.45
  max_detections_per_image: 100

# Evaluation Framework (Senmozhi Step 6)
evaluation:
  metrics:
    - "confusion_matrix" # Confusion Matrix for all four classes
    - "roc_auc"          # ROC-AUC analysis
    - "precision"
    - "recall"
    - "f1_score"
    - "mean_average_precision_mAP"
  comparative_baselines: # Comparative models required in Senmozhi Work II
    - "SVM"
    - "KNN"
    - "Standard_CNN"
    - "Random_Forest"

# Risk Categorization (Senmozhi Step 6 & Architecture Diagram)
risk_assessment:
  categories:
    low:
      max_defect_coverage_pct: 5.0
      allowed_classes: ["Normal"]
    medium:
      max_defect_coverage_pct: 15.0
      allowed_classes: ["Moss"]
    high:
      max_defect_coverage_pct: 100.0
      allowed_classes: ["Crack", "Seepage"]
